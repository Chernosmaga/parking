databaseChangeLog:
  - changeSet:
      id: create-booking
      author: Sergey
      changes:
        - createTable:
            tableName: bookings
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: false
                    nullable: false
              - column:
                  name: booker_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: booker_id
                    references: users (id)
              - column:
                  name: spot_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: spot_id
                    references: spots (id)
              - column:
                  name: vehicle_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: vehicle_id
                    references: vehicles (id)
              - column:
                  name: start_time
                  type: timestamp without time zone
                  constraints:
                    nullable: false
              - column:
                  name: end_time
                  type: timestamp without time zone
                  constraints:
                    nullable: false
              - column:
                  name: is_tradable
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: is_paid
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: bill
                  type: varchar
              - column:
                  name: is_subscription
                  type: boolean
                  constraints:
                    nullable: false
        - sql:
            sql: |
              INSERT INTO bookings (booker_id, spot_id, vehicle_id, start_time, end_time, is_tradable, is_paid, bill, is_subscription)
              VALUES (1, 2, 1, '2024-01-01 14:50:54', '2024-10-01 15:00:00', true, true, 'here is the bill', false);